name: Collect paper catalog

on:
  pull_request:
    paths:
      - 'scripts/build_catalog.py'
      - 'triage/catalog.py'
      - 'scripts/embed_catalog.mjs'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install requests numpy && npm ci
      - name: Collect public metadata
        run: python scripts/build_catalog.py
      - name: Embed papers (MiniLM)
        run: node scripts/embed_catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paper-catalog
          path: data/catalog/
          if-no-files-found: error
