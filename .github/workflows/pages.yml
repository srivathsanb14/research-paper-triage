name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (without torch)
        run: |
          python -m pip install -r requirements-core.txt 'anthropic>=1.0' 'pytest>=8.0'
          npm ci
      - name: Cache MiniLM weights for catalog embeddings
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: minilm-q8-v1
      - name: Restore last refreshed catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: data/catalog
          key: paper-catalog-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: paper-catalog-v2-
      - name: Refresh shared paper catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if ! python scripts/build_catalog.py; then
            echo '::warning::Catalog refresh failed. Publishing the last bundled catalog with its original update date.'
            test -f data/catalog/manifest.json
          fi
      - name: Embed new or changed catalog shards (MiniLM)
        run: node scripts/embed_catalog.mjs
      - name: Test Python engine
        run: python -m pytest -q
      - name: Test browser engine
        run: npm run test:js
      - name: Build site
        run: python scripts/build_pages.py
      - name: End-to-end browser check
        env:
          OFFLINE_MODEL: '1'  # deterministic: the semantic path is exercised by the embedding step above
        run: |
          npx playwright install --with-deps chromium
          npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Keep validated catalog for the next refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: data/catalog
          key: paper-catalog-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional mirror on a Hugging Face static Space. Set the repository secret
  # HF_TOKEN (write access) and the variable HF_SPACE (e.g. "user/paper-triage").
  hugging-face:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Unpack site
        run: mkdir -p site && tar -xf artifact/artifact.tar -C site
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: scripts/build_pages.py
      - name: Add Space front matter
        run: python -c "import sys; sys.path.insert(0, 'repo/scripts'); import build_pages, pathlib; pathlib.Path('site/README.md').write_text(build_pages.SPACE_README)"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install -q 'huggingface_hub>=0.30'
          hf upload "${{ vars.HF_SPACE }}" site . --repo-type=space --delete='*' --commit-message="Deploy ${GITHUB_SHA::7}"
