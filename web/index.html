<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Triage</title>
    <meta name="description" content="Too many papers? Describe your research once. Paper Triage sorts recent papers into Read, Skim and Skip, explains why, and shows whether each one is worth trusting. Runs in your browser.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="Paper Triage: read the right papers">
    <meta property="og:description" content="Personalised Read / Skim / Skip triage for research papers, with worth-it signals. No account; runs in your browser.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a5f'/%3E%3Cpath d='M18 20h28M18 32h20M18 44h12' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap">
    <link rel="stylesheet" href="./styles.css">
    <link rel="modulepreload" href="./js/app.js">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#/feed" aria-label="Paper Triage home">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Paper Triage</span>
      </a>
      <details id="profile-menu" class="menu" hidden>
        <summary aria-label="Research profile" title="Switch or edit your research profile"><span id="profile-name">Profile</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="menu-list" id="profile-list" role="menu"></div>
      </details>
      <nav id="nav" aria-label="Sections" hidden></nav>
      <div class="top-right">
        <span id="model-pill" class="pill model loading" role="status"><span class="dot"></span>Loading…</span>
        <button id="account-btn" class="btn small ghost" type="button" data-act="account" hidden></button>
        <button class="icon-only" type="button" data-act="settings" aria-label="Settings" title="Settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="icon-only" type="button" data-act="help" aria-label="Help and keyboard shortcuts" title="Help"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="boot" class="boot" aria-live="polite">
        <div class="spinner"></div>
        <p id="boot-status">Loading papers…</p>
        <button id="boot-retry" class="btn" type="button" hidden>Try again</button>
      </section>
    </main>

    <dialog id="profile-dialog" aria-label="Research interests"><div class="dialog-body"></div></dialog>
    <dialog id="settings-dialog" aria-label="Settings"><div class="dialog-body"></div></dialog>
    <dialog id="account-dialog" aria-label="Account"><div class="dialog-body"></div></dialog>
    <dialog id="help-dialog" aria-label="Help"><div class="dialog-body"></div></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="noscript">Paper Triage needs JavaScript. Enable it and reload this page.</p></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
